name: Deploy (prod) with ec2-instance

on:
  push:
    branches: [ "main" ]

env:
  SERVICE_NAME: user-service

permissions:
  contents: read
  packages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 권한 부여 및 빌드
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: 4. Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Docker 이미지 빌드 및 푸시
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ env.SERVICE_NAME }}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: 6. 백엔드 EC2 원격 자동 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '15.164.172.146' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          SPRING_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.SPRING_KAFKA_BOOTSTRAP_SERVERS }}
          SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${{ secrets.EUREKA_CLIENT_SERVICEURL_DEFAULTZONE }}
          BACKEND_EC2_PRIVATE_IP: ${{ secrets.BACKEND_EC2_PRIVATE_IP }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ubuntu@"$EC2_HOST" "mkdir -p ~/infra-backend ~/apps/${{ env.SERVICE_NAME }}"
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml ubuntu@"$EC2_HOST":~/apps/${{ env.SERVICE_NAME }}/docker-compose.prod.yml
          cat <<EOF | ssh -o StrictHostKeyChecking=no ubuntu@"$EC2_HOST" "cat > ~/infra-backend/.env"
          DB_HOST=$DB_HOST
          SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
          SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
          SPRING_DATA_REDIS_HOST=$SPRING_DATA_REDIS_HOST
          SPRING_DATA_REDIS_PORT=$SPRING_DATA_REDIS_PORT
          SPRING_DATA_REDIS_PASSWORD=$SPRING_DATA_REDIS_PASSWORD
          SPRING_KAFKA_BOOTSTRAP_SERVERS=$SPRING_KAFKA_BOOTSTRAP_SERVERS
          SPRING_DATA_MONGODB_URI=$SPRING_DATA_MONGODB_URI
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=$EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          BACKEND_EC2_PRIVATE_IP=$BACKEND_EC2_PRIVATE_IP
          EOF
          ssh -o StrictHostKeyChecking=no ubuntu@"$EC2_HOST" "
            set -e
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}
            docker compose --env-file ~/infra-backend/.env -f ~/apps/${{ env.SERVICE_NAME }}/docker-compose.prod.yml pull
            docker compose --env-file ~/infra-backend/.env -f ~/apps/${{ env.SERVICE_NAME }}/docker-compose.prod.yml up -d --no-deps
            docker image prune -f
          "
